<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Status Update - ORR Solutions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d223c;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #204460;
            border-radius: 16px;
            overflow: hidden;
            --border-color: {{status_border_color}};
            border: 1px solid var(--border-color, rgba(14, 194, 119, 0.1));
        }

        .header {
            --bg-color: {{status_color}};
            background-color: var(--bg-color, #0EC277);
            padding: 30px 20px;
            text-align: center;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .footer {
            background-color: #071626;
            padding: 30px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .status-box {
            background-color: #0A1F30;
            border-radius: 12px;
            padding: 25px;
            margin: 25px 0;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: var(--bg-color, #0EC277);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 20px;
            text-transform: uppercase;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .feedback-box {
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-style: italic;
            color: #fca5a5;
            --feedback-view: {{feedback_display}};
            display: var(--feedback-view, block);
        }

        @media only screen and (max-width: 600px) {
            .container {
                border-radius: 0;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center" style="padding: 20px 0; background-color: #0d223c;">
                <table class="container" border="0" cellspacing="0" cellpadding="0">
                    <!-- Header -->
                    <tr>
                        <td class="header">
                            <img src="https://res.cloudinary.com/depeqzb6z/image/upload/v1764395173/logo_qqpk6j.svg"
                                alt="ORR Solutions" width="120"
                                style="display: block; margin: 0 auto; max-width: 100%;">
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td class="content">
                            <h2>Invoice {{status_label}}</h2>
                            <p>We've processed your invoice submission <strong>#{{invoice_id}}</strong>. The status has been updated to <strong>{{status_label}}</strong>.</p>

                            <div class="status-box">
                                <div style="color: #94a3b8; font-size: 12px; text-transform: uppercase;">Amount</div>
                                <div style="color: #ffffff; font-weight: 800; font-size: 28px; margin-top: 5px;">{{currency_symbol}}{{invoice_amount}}</div>
                                
                                <div class="feedback-box">
                                    <strong>Notes:</strong> {{reviewer_feedback}}
                                </div>
                            </div>

                            <div style="text-align: center;">
                                <a href="{{action_url}}" class="btn">{{cta_label}}</a>
                            </div>

                            <p style="font-size: 13px; color: #64748b; margin-top: 30px;">
                                Reference: {{status_timestamp}}
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer">
                            <p>&copy; 2026 ORR Solutions Billing Department.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
