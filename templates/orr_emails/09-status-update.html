<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Update - ORR Solutions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d223c;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #204460;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(14, 194, 119, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #28b026 0%, #03f6ca 100%);
            padding: 40px 20px;
            text-align: center;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .footer {
            background-color: #071626;
            padding: 30px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0A1F30;
            border: 1px solid #0EC277;
            color: #0EC277;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-container {
            margin: 30px 0;
            padding: 20px;
            background-color: #0A1F30;
            border-radius: 12px;
        }

        .progress-bar {
            height: 8px;
            background-color: #1e293b;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background-color: #0EC277;
            border-radius: 4px;
        }

        .step-label {
            display: inline-block;
            width: 32%;
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
        }

        .step-active {
            color: #0EC277;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #0EC277;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 25px;
            text-transform: uppercase;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        @media only screen and (max-width: 600px) {
            .container {
                border-radius: 0;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center" style="padding: 20px 0; background-color: #0d223c;">
                <table class="container" border="0" cellspacing="0" cellpadding="0">
                    <!-- Header -->
                    <tr>
                        <td class="header">
                            <img src="https://res.cloudinary.com/depeqzb6z/image/upload/v1764395173/logo_qqpk6j.svg"
                                alt="ORR Solutions" width="120"
                                style="display: block; margin: 0 auto; max-width: 100%;">
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td class="content">
                            <h2>Status Updated</h2>
                            <p>There has been progress on your request for <strong>{{form_name}}</strong>. Your current
                                status is now:</p>

                            <div class="status-badge">{{current_status}}</div>

                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 50%; --progress: {{progress_percentage}}%; width: var(--progress);"></div>
                                </div>
                                <div style="text-align: justify; text-justify: inter-word;">
                                    <span class="step-label {{step_1_class}}">Received</span>
                                    <span class="step-label {{step_2_class}}"
                                        style="text-align: center;">Processing</span>
                                    <span class="step-label {{step_3_class}}"
                                        style="text-align: right;">Completed</span>
                                </div>
                            </div>

                            <p style="font-size: 14px;">Reference ID: <span
                                    style="color: #0EC277; font-family: monospace;">{{reference_id}}</span></p>

                            <div style="text-align: center; margin-top: 20px;">
                                <a href="{{tracking_link}}" class="btn">Track Details</a>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer">
                            <p style="margin-bottom: 10px;">Questions about this update? <a href="#"
                                    style="color: #0EC277;">Check FAQ</a>.</p>
                            <p>&copy; 2026 ORR Solutions. All rights reserved.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
