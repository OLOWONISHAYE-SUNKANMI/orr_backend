<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Failure - ORR Solutions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d223c;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #204460;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #f59e0b; /* Amber for warning */
        }

        .header {
            background-color: #f59e0b;
            padding: 30px 20px;
            text-align: center;
        }

        .content {
            padding: 40px 30px;
        }

        .footer {
            background-color: #071626;
            padding: 30px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .failure-box {
            background-color: #0A1F30;
            border-radius: 12px;
            padding: 25px;
            margin: 25px 0;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #f59e0b;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 10px;
            text-transform: uppercase;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 16px;
            font-weight: 700;
            text-align: center;
        }

        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .meta-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; }
        .meta-value { color: #ffffff; font-family: monospace; font-size: 14px; margin-bottom: 15px; }

        @media only screen and (max-width: 600px) {
            .container {
                border-radius: 0;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center" style="padding: 20px 0; background-color: #0d223c;">
                <table class="container" border="0" cellspacing="0" cellpadding="0">
                    <!-- Header -->
                    <tr>
                        <td class="header">
                            <img src="https://res.cloudinary.com/depeqzb6z/image/upload/v1764395173/logo_qqpk6j.svg"
                                alt="ORR Solutions" width="120"
                                style="display: block; margin: 0 auto; max-width: 100%;">
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td class="content">
                            <h2>Webhook Delivery Failure</h2>
                            <p>An incoming webhook from <strong>{{source_service}}</strong> failed to process correctly in n8n. Retries may be necessary.</p>

                            <div class="failure-box">
                                <div class="meta-label">Source Service</div>
                                <div class="meta-value" style="color: #f59e0b;">{{source_service}}</div>

                                <div class="meta-label">Endpoint URL</div>
                                <div class="meta-value">{{endpoint_url}}</div>

                                <div class="meta-label">Payload Preview</div>
                                <div style="background-color: #071626; padding: 10px; border-radius: 6px; font-size: 12px; color: #94a3b8; overflow: hidden;">
                                    {{payload_json}}
                                </div>
                            </div>

                            <div style="text-align: center;">
                                <a href="{{n8n_execution_url}}" class="btn">Retry in n8n</a>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer">
                            <p>&copy; 2026 ORR Solutions Automation Monitor.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
