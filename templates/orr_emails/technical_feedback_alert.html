<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; }
        .header { text-align: center; border-bottom: 2px solid #0EC277; padding-bottom: 20px; margin-bottom: 20px; }
        .details { background-color: #f9f9f9; padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Technical Feedback</h2>
        </div>
        <p>A user has submitted new technical feedback or a bug report.</p>
        
        <div class="details">
            <p><strong>Subject:</strong> {{subject}}</p>
            <p><strong>User:</strong> {{user_name}} ({{user_email}})</p>
            <p><strong>Browser:</strong> {{browser_info}}</p>
            <p><strong>OS:</strong> {{os_info}}</p>
            <p><strong>URL Path:</strong> {{url_path}}</p>
            <p><strong>Attachment:</strong> <a href="{{attachment_url}}">View Attachment</a></p>
        </div>
        
        <h3>Description:</h3>
        <p>{{description}}</p>
        
        <p style="margin-top: 30px; font-size: 12px; color: #777;">ORR Solutions System</p>
    </div>
</body>
</html>
