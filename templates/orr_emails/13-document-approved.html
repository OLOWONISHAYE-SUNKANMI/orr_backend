<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Approved - ORR Solutions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d223c;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #204460;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #0EC277;
        }

        .header {
            background-color: #0EC277;
            padding: 30px 20px;
            text-align: center;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .footer {
            background-color: #071626;
            padding: 30px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #0EC277;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 20px;
            text-transform: uppercase;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        @media only screen and (max-width: 600px) {
            .container {
                border-radius: 0;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center" style="padding: 20px 0; background-color: #0d223c;">
                <table class="container" border="0" cellspacing="0" cellpadding="0">
                    <!-- Header -->
                    <tr>
                        <td class="header">
                            <img src="https://res.cloudinary.com/depeqzb6z/image/upload/v1764395173/logo_qqpk6j.svg"
                                alt="ORR Solutions" width="120"
                                style="display: block; margin: 0 auto; max-width: 100%;">
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td class="content">
                            <div class="success-icon">✅</div>
                            <h2>Document Approved</h2>
                            <p>Great news! Your document <strong>{{document_name}}</strong> has been approved and finalized in the vault.</p>

                            <div style="background-color: #0A1F30; border-radius: 12px; padding: 20px; margin: 20px 0; border: 1px solid rgba(14, 194, 119, 0.2);">
                                <div style="color: #94a3b8; font-size: 13px;">Storage Location:</div>
                                <div style="color: #ffffff; font-weight: 600;">Vault / {{folder_path}}</div>
                            </div>

                            <div style="text-align: center;">
                                <a href="{{document_url}}" class="btn">Access Final Copy</a>
                            </div>

                            <p style="font-size: 13px; color: #64748b; margin-top: 30px;">
                                This document is now read-only to preserve its finalized state.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer">
                            <p>&copy; 2026 ORR Solutions Secure Vault.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
