<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Status Update - ORR Solutions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d223c;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #204460;
            border-radius: 16px;
            overflow: hidden;
            --border-color: {{status_color}};
            border: 2px solid var(--border-color, #0EC277);
        }

        .header {
            --bg-color: {{status_color}};
            background-color: var(--bg-color, #0EC277);
            padding: 30px 20px;
            text-align: center;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .footer {
            background-color: #071626;
            padding: 30px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 14px;
            margin-bottom: 20px;
            --badge-bg: {{status_color}};
            background-color: var(--badge-bg, #0EC277);
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            --btn-bg: {{status_color}};
            background-color: var(--btn-bg, #0EC277);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 20px;
            text-transform: uppercase;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        @media only screen and (max-width: 600px) {
            .container {
                border-radius: 0;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center" style="padding: 20px 0; background-color: #0d223c;">
                <table class="container" border="0" cellspacing="0" cellpadding="0">
                    <!-- Header -->
                    <tr>
                        <td class="header">
                            <img src="https://res.cloudinary.com/depeqzb6z/image/upload/v1764395173/logo_qqpk6j.svg"
                                alt="ORR Solutions" width="120"
                                style="display: block; margin: 0 auto; max-width: 100%;">
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td class="content">
                            <div class="status-badge">{{decision_label}}</div>
                            <h2>Decision Finalized</h2>
                            <p>The administrative review for your request <strong>"{{action_name}}"</strong> is complete.</p>

                            <div style="background-color: #0A1F30; border-radius: 12px; padding: 25px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.05); text-align: left;">
                                <div style="color: #94a3b8; font-size: 11px; text-transform: uppercase; margin-bottom: 5px;">Reviewer Notes:</div>
                                <div style="color: #ffffff; font-size: 15px; font-style: italic;">"{{reviewer_comments}}"</div>
                            </div>

                            <div style="text-align: center;">
                                <a href="{{action_log_url}}" class="btn">View Request Log</a>
                            </div>

                            <p style="font-size: 13px; color: #64748b; margin-top: 30px;">
                                Timestamp: {{decision_time}} | Reference: #{{request_id}}
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer">
                            <p>&copy; 2026 ORR Solutions Governance Monitor.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
