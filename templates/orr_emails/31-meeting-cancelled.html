<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Cancelled - ORR Solutions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d223c;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #204460;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #ef4444;
        }

        .header {
            background-color: #ef4444;
            padding: 40px 20px;
            text-align: center;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .footer {
            background-color: #071626;
            padding: 30px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .cancellation-card {
            background-color: #0A1F30;
            border-radius: 12px;
            padding: 25px;
            margin: 25px 0;
            border: 1px solid #ef4444;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #334155;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 20px;
            text-transform: uppercase;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .reason-label { color: #ef4444; font-size: 12px; text-transform: uppercase; margin-bottom: 5px; font-weight: 700; }
        .reason-value { color: #ffffff; font-style: italic; }

        @media only screen and (max-width: 600px) {
            .container {
                border-radius: 0;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center" style="padding: 20px 0; background-color: #0d223c;">
                <table class="container" border="0" cellspacing="0" cellpadding="0">
                    <!-- Header -->
                    <tr>
                        <td class="header">
                            <img src="https://res.cloudinary.com/depeqzb6z/image/upload/v1764395173/logo_qqpk6j.svg"
                                alt="ORR Solutions" width="120"
                                style="display: block; margin: 0 auto; max-width: 100%;">
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td class="content">
                            <h2>Meeting Cancelled</h2>
                            <p>The scheduled meeting <strong>{{meeting_subject}}</strong> has been cancelled and removed from the calendar.</p>

                            <div class="cancellation-card">
                                <div class="reason-label">Reason for Cancellation</div>
                                <div class="reason-value">"{{cancellation_reason}}"</div>
                                <div style="color: #94a3b8; font-size: 14px; margin-top: 15px;">Original Time: {{meeting_time}}</div>
                            </div>

                            <div style="text-align: center;">
                                <a href="{{scheduling_url}}" class="btn">Schedule New Meeting</a>
                            </div>

                            <p style="font-size: 13px; color: #64748b; margin-top: 30px;">
                                We apologize for any inconvenience caused.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer">
                            <p>&copy; 2026 ORR Solutions Scheduling Hub.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
